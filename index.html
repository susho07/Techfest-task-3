<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Accessible Landing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Landing Page</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <div class="hero-text">
        <h2>Welcome to Our Website</h2>
        <p>Experience a clean, responsive, and accessible design built mobile-first. This is designed to adapt beautifully across devices.</p>
        <a href="#contact" class="btn">Get in Touch</a>
      </div>
    </section>

    <section id="contact" class="contact">
      <h2>Contact Us</h2>
      <form id="contactForm" aria-label="Contact Form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required aria-required="true" aria-describedby="nameError">
        <span id="nameError" class="error" aria-live="polite"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required aria-required="true" aria-describedby="emailError">
        <span id="emailError" class="error" aria-live="polite"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" required aria-required="true" aria-describedby="msgError"></textarea>
        <span id="msgError" class="error" aria-live="polite"></span>

        <button type="submit">Submit</button>
        <p id="formMessage" class="success" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 My Website. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
